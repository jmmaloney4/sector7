name: 📌 add to project
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label(s) for the job (string label or JSON array of labels; self-hosted must include light or heavy)'
        required: false
        default: '["self-hosted","heavy"]'
        type: string
      project_url:
        description: 'GitHub Project URL (e.g. https://github.com/orgs/ORG/projects/N or https://github.com/users/USER/projects/N)'
        required: false
        default: 'https://github.com/orgs/ergodicsystems/projects/1'
        type: string
      labeled:
        description: 'Optional comma-separated labels; omit or leave empty to add all matching events. When set, items are filtered per label-operator.'
        required: false
        default: ''
        type: string
      label-operator:
        description: 'How to apply labeled filter: AND, OR, or NOT (default OR)'
        required: false
        default: OR
        type: string
    secrets:
      github-token:
        description: 'GitHub personal access token with project write access'
        required: true
permissions:
  contents: read
jobs:
  add-to-project:
    runs-on: ${{ (startsWith(inputs.runs-on, '[') || startsWith(inputs.runs-on, '{')) && fromJson(inputs.runs-on) || inputs.runs-on }}
    steps:
      # sector7's own actions run from this workflow's commit, so a caller's
      # pin on the workflow pins every action it runs (zeus#5442). Keep this
      # after any default-path checkout: that one cleans the workspace.
      - name: check out sector7 at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sector7
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Add issue or PR to project
        uses: ./.sector7/.github/actions/add-to-project
        with:
          project-url: ${{ inputs.project_url }}
          github-token: ${{ secrets.github-token }}
          labeled: ${{ inputs.labeled }}
          label-operator: ${{ inputs.label-operator }}
