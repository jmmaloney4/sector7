name: Create ADR Placeholder
description: Creates placeholder ADR file on main branch with link to PR
inputs:
  adr_files:
    description: Path to file containing list of ADR files (one per line)
    required: true
  pr_url:
    description: The pull request URL
    required: true
  pr_number:
    description: The pull request number (optional, used for commit message)
    required: false
  commit_message:
    description: Custom commit message (optional). Use {{adr_numbers}}, {{pr_number}}, and {{pr_url}} placeholders.
    required: false
  base_branch:
    description: Base branch to reserve ADR numbers on (e.g., main)
    required: false
    default: main
  post-generate-command:
    description: Optional bash command run in the consumer checkout after writing the stub and before commit (e.g. `nix fmt && python scripts/generate_internal_indexes.py`). Empty skips the hook. On failure the action exits without committing or pushing. After the hook, only the ADR stub(s) this action wrote plus paths the command created or modified are staged; pre-existing dirty or untracked paths the hook did not change are left unstaged.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      run: ${{ github.action_path }}/script.sh
      env:
        ADR_FILES: ${{ inputs.adr_files }}
        PR_URL: ${{ inputs.pr_url }}
        PR_NUMBER: ${{ inputs.pr_number }}
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
        BASE_BRANCH: ${{ inputs.base_branch }}
        POST_GENERATE_COMMAND: ${{ inputs.post-generate-command }}
