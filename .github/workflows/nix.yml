name: '❄️ nix'
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label(s) for all jobs (string label or JSON array of labels; self-hosted must include light or heavy)'
        required: false
        default: '["self-hosted","heavy"]'
        type: string
      repository:
        description: 'Repository to checkout and build (format: owner/repo)'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout and build'
        required: true
        type: string
      image-namespace:
        description: 'Namespace to push docker images to (e.g. cavinsresearch or jmmaloney4)'
        required: false
        default: 'cavinsresearch'
        type: string
      binary-cache-url:
        description: 'Optional full binary cache URL to add as a substituter (for example https://cache.example.com/cache)'
        required: false
        default: ''
        type: string
      binary-cache-public-key:
        description: 'Optional trusted public key for the binary cache'
        required: false
        default: ''
        type: string
      binary-cache-endpoint:
        description: 'Optional Attic server endpoint (root URL) used for cache pushes'
        required: false
        default: ''
        type: string
      binary-cache-name:
        description: 'Optional Attic cache name used for cache pushes'
        required: false
        default: ''
        type: string
      build-first:
        description: 'Newline-delimited globs of "<category>.<name>" targets (e.g. packages.rust-test-deps) built in a first stage; the rest of the matrix starts only after that stage finishes. Name shared, expensive derivations that other checks depend on: a check needing one blocks on the nix daemon lock while holding a runner slot, so a one-stage matrix wastes slots (GitHub does not start matrix jobs in include order, so ordering alone does not help). Stage only: nothing is added or dropped. A failed first stage does not skip the second.'
        required: false
        default: ''
        type: string
      allow-unpatched-attic-client:
        description: 'Emergency opt-out. When the patched attic client (bounded NAR channel) cannot be built or fetched, a job pushing to the binary cache fails, because nixpkgs'' unpatched client buffers whole NARs in memory and OOM-kills runners (seven#378). Set true to fall back to it with a warning instead.'
        required: false
        default: false
        type: boolean
      max-parallel:
        description: 'How many matrix build jobs run at once. Set it to the number of runners the caller scale set can give this workflow; a job beyond that just queues.'
        required: false
        default: 2
        type: number
    secrets:
      REGISTRY_PASSWORD:
        description: 'Registry password/token (usually GITHUB_TOKEN)'
        required: false
      BINARY_CACHE_TOKEN:
        description: 'Optional Attic token used to push built store paths into the binary cache'
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded runs are never cancelled: GitHub keeps the running job plus only
  # the newest pending one, so pushes coalesce and each finished run covers
  # everything pushed so far. (Jack, 2026-11-09: cancelling a running check
  # when a new commit lands wasted more than it saved.)
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
  packages: write
env:
  # Read by nix-setup/resolve-attic-client.sh in every job's attic steps.
  ATTIC_CLIENT_ALLOW_STOCK: ${{ inputs.allow-unpatched-attic-client && '1' || '' }}
jobs:
  detect:
    name: '☃️ detect flake outputs'
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJson(inputs.runs-on) || inputs.runs-on }}
    outputs:
      build_matrix_include: ${{ steps.split.outputs.build_matrix_include }}
      build_has_work: ${{ steps.split.outputs.build_has_work }}
      first_matrix_include: ${{ steps.split.outputs.first_matrix_include }}
      first_has_work: ${{ steps.split.outputs.first_has_work }}
      images_to_push: ${{ steps.split.outputs.image_matrix }}
      deferred_count: ${{ steps.split.outputs.deferred_count }}
      deferred_names: ${{ steps.split.outputs.deferred_names }}
    env:
      # Provided so nix-setup can start `attic watch-store`, which seeds the
      # nix-eval-jobs closure built below into the cache for future runs.
      BINARY_CACHE_TOKEN: ${{ secrets.BINARY_CACHE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
      # sector7's own actions run from this workflow's commit, so a caller's
      # pin on the workflow pins every action it runs (zeus#5442). Keep this
      # after any default-path checkout: that one cleans the workspace.
      - name: check out sector7 at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sector7
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.sector7/.github/actions/nix-setup
        with:
          runs-on: ${{ inputs.runs-on }}
          cache: ${{ !contains(inputs.runs-on, 'self-hosted') && inputs.binary-cache-url == '' }}
          extra-substituters: ${{ inputs.binary-cache-url }}
          extra-trusted-public-keys: ${{ inputs.binary-cache-public-key }}
          attic-endpoint: ${{ inputs.binary-cache-endpoint }}
          attic-cache-name: ${{ inputs.binary-cache-name }}
          attic-token: ${{ secrets.BINARY_CACHE_TOKEN }}
      - name: compute build-needed matrix via nix-eval-jobs
        id: compute
        uses: ./.sector7/.github/actions/compute-flake-build-matrix
        with:
          probe-timeout-seconds: '180'
          build-first: ${{ inputs.build-first }}
          extra-substituters: ${{ inputs.binary-cache-url }}
          extra-trusted-public-keys: ${{ inputs.binary-cache-public-key }}
      - name: split build and image matrices
        id: split
        shell: 'nix shell nixpkgs#jq -c bash {0}'
        run: |
          set -euo pipefail
          matrix='${{ steps.compute.outputs.matrix_include }}'
          bash .sector7/.github/actions/compute-flake-build-matrix/split-matrix.sh <<<"$matrix" | tee -a "$GITHUB_OUTPUT"
  build-first:
    # Stage 1: the caller's `build-first` targets (shared, expensive derivations).
    # Empty unless the caller sets that input. See the input's description.
    name: "🧱 ${{ matrix.category }}.${{ matrix.system }}.${{ matrix.name }}"
    needs: [detect]
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJson(inputs.runs-on) || inputs.runs-on }}
    if: ${{ needs.detect.outputs.first_has_work == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        include: ${{ fromJson(needs.detect.outputs.first_matrix_include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
      # sector7's own actions run from this workflow's commit, so a caller's
      # pin on the workflow pins every action it runs (zeus#5442). Keep this
      # after any default-path checkout: that one cleans the workspace.
      - name: check out sector7 at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sector7
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.sector7/.github/actions/nix-build-attr-v2
        with:
          flake-attr: ${{ matrix.flake_attr }}
          runs-on: ${{ inputs.runs-on }}
          binary-cache-url: ${{ inputs.binary-cache-url }}
          binary-cache-public-key: ${{ inputs.binary-cache-public-key }}
          binary-cache-endpoint: ${{ inputs.binary-cache-endpoint }}
          binary-cache-name: ${{ inputs.binary-cache-name }}
          attic-token: ${{ secrets.BINARY_CACHE_TOKEN }}
  build:
    name: "👷‍♂️ ${{ matrix.category }}.${{ matrix.system }}.${{ matrix.name }}"
    # Runs after build-first whatever its result: a failed shared dependency
    # must not hide the other checks' results. Skipped (no first-stage work) is
    # the common case; only a cancelled run or a failed detect stops this.
    needs: [detect, build-first]
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJson(inputs.runs-on) || inputs.runs-on }}
    if: ${{ !cancelled() && needs.detect.result == 'success' && needs.build-first.result != 'cancelled' && needs.detect.outputs.build_has_work == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        include: ${{ fromJson(needs.detect.outputs.build_matrix_include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
      # sector7's own actions run from this workflow's commit, so a caller's
      # pin on the workflow pins every action it runs (zeus#5442). Keep this
      # after any default-path checkout: that one cleans the workspace.
      - name: check out sector7 at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sector7
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.sector7/.github/actions/nix-build-attr-v2
        with:
          flake-attr: ${{ matrix.flake_attr }}
          runs-on: ${{ inputs.runs-on }}
          binary-cache-url: ${{ inputs.binary-cache-url }}
          binary-cache-public-key: ${{ inputs.binary-cache-public-key }}
          binary-cache-endpoint: ${{ inputs.binary-cache-endpoint }}
          binary-cache-name: ${{ inputs.binary-cache-name }}
          attic-token: ${{ secrets.BINARY_CACHE_TOKEN }}
  build-and-push-images:
    name: "🐳 build+push ${{ matrix.package-name }}"
    needs: [detect]
    if: ${{ needs.detect.outputs.images_to_push != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        package-name: ${{ fromJson(needs.detect.outputs.images_to_push) }}
    # A job-level `uses:` takes no expressions, and GitHub does not document
    # what `./` resolves to in a workflow called from another repo, so this
    # one is pinned by SHA: it lags this file by one commit until Renovate
    # bumps it (zeus#5442).
    uses: jmmaloney4/sector7/.github/workflows/push-nix-image.yml@fe2e854373716bbe5fef378fd703708e63129d8f # main
    with:
      runs-on: ${{ inputs.runs-on }}
      package-name: ${{ matrix.package-name }}
      namespace: ${{ inputs.image-namespace }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      tags: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('sha-{0},{1}{2}', github.sha, github.ref_name, github.ref_name == 'main' && ',latest' || '') }}
      binary-cache-url: ${{ inputs.binary-cache-url }}
      binary-cache-public-key: ${{ inputs.binary-cache-public-key }}
      binary-cache-endpoint: ${{ inputs.binary-cache-endpoint }}
      binary-cache-name: ${{ inputs.binary-cache-name }}
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      BINARY_CACHE_TOKEN: ${{ secrets.BINARY_CACHE_TOKEN }}
  gate:
    # One stable check name for branch protection. The matrix jobs above are named
    # per flake output, so requiring them one by one never covers a new check and
    # blocks forever on a removed one. Skipped is fine (no checks, no images);
    # failed or cancelled is not, and a skipped `build` after a failed `detect`
    # still fails here because `detect` is in `needs`. It also fails when detect
    # deferred targets over GitHub's matrix limit: those were never built.
    name: '✅ nix gate'
    if: ${{ always() }}
    needs: [detect, build-first, build, build-and-push-images]
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJson(inputs.runs-on) || inputs.runs-on }}
    steps:
      - name: check out sector7 at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sector7
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Fail unless every nix job succeeded or was skipped and nothing was deferred
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash .sector7/.github/actions/compute-flake-build-matrix/gate-verdict.sh
