name: '🚀 Push Nix Image to Registry'
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label(s) for all jobs (string label or JSON array of labels; self-hosted must include light or heavy)'
        required: true
        type: string
      package-name:
        description: 'Nix package name (e.g., zeus-image, ci-image)'
        required: true
        type: string
      registry:
        description: 'Container registry (default: ghcr.io)'
        required: false
        type: string
        default: 'ghcr.io'
      namespace:
        description: 'Registry namespace (e.g., org/repo)'
        required: true
        type: string
      image-name:
        description: 'Image name in registry (defaults to package-name without -image suffix)'
        required: false
        type: string
      tags:
        description: 'Comma-separated list of tags (e.g., latest,v1.0.0,pr-123)'
        required: true
        type: string
      system:
        description: 'Nix system (default: x86_64-linux)'
        required: false
        type: string
        default: 'x86_64-linux'
      repository:
        description: 'Repository to checkout'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout'
        required: true
        type: string
      binary-cache-url:
        description: 'Optional full binary cache URL to add as a substituter'
        required: false
        type: string
        default: ''
      binary-cache-public-key:
        description: 'Optional trusted public key for the binary cache'
        required: false
        type: string
        default: ''
      binary-cache-endpoint:
        description: 'Optional Attic server endpoint (root URL) for cache pushes'
        required: false
        type: string
        default: ''
      binary-cache-name:
        description: 'Optional Attic cache name for cache pushes'
        required: false
        type: string
        default: ''
      allow-unpatched-attic-client:
        description: 'Emergency opt-out: fall back to nixpkgs'' unpatched attic client, with a warning, when the patched one cannot be had, instead of failing (seven#378).'
        required: false
        default: false
        type: boolean
    secrets:
      REGISTRY_USERNAME:
        description: 'Registry username (defaults to github.actor)'
        required: false
      REGISTRY_PASSWORD:
        description: 'Registry password/token (usually GITHUB_TOKEN)'
        required: true
      BINARY_CACHE_TOKEN:
        description: 'Optional Attic token used to push built store paths into the binary cache'
        required: false
env:
  # Read by nix-setup/resolve-attic-client.sh.
  ATTIC_CLIENT_ALLOW_STOCK: ${{ inputs.allow-unpatched-attic-client && '1' || '' }}
jobs:
  push-image:
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJson(inputs.runs-on) || inputs.runs-on }}
    env:
      BINARY_CACHE_TOKEN: ${{ secrets.BINARY_CACHE_TOKEN }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
      # sector7's own actions run from this workflow's commit, so a caller's
      # pin on the workflow pins every action it runs (zeus#5442). Keep this
      # after any default-path checkout: that one cleans the workspace.
      - name: check out sector7 at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sector7
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Install Nix
        uses: ./.sector7/.github/actions/nix-setup
        with:
          runs-on: ${{ inputs.runs-on }}
          cache: ${{ !contains(inputs.runs-on, 'self-hosted') && inputs.binary-cache-url == '' }}
          extra-substituters: ${{ inputs.binary-cache-url }}
          extra-trusted-public-keys: ${{ inputs.binary-cache-public-key }}
      - name: Push Nix Image
        uses: ./.sector7/.github/actions/push-nix-image
        with:
          package-name: ${{ inputs.package-name }}
          registry: ${{ inputs.registry }}
          namespace: ${{ inputs.namespace }}
          image-name: ${{ inputs.image-name }}
          tags: ${{ inputs.tags }}
          system: ${{ inputs.system }}
          registry-username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Push image derivation to binary cache
        if: ${{ inputs.binary-cache-endpoint != '' && inputs.binary-cache-name != '' && env.BINARY_CACHE_TOKEN != '' }}
        uses: ./.sector7/.github/actions/push-attic-cache
        with:
          flake-attr: ${{ format('.#packages.{0}.{1}', inputs.system, inputs.package-name) }}
          attic-endpoint: ${{ inputs.binary-cache-endpoint }}
          attic-cache-name: ${{ inputs.binary-cache-name }}
          attic-token: ${{ env.BINARY_CACHE_TOKEN }}
