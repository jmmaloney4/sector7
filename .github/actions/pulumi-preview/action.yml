name: Pulumi Preview
description: Run Pulumi preview and generate artifacts and a markdown summary
inputs:
  project:
    description: Pulumi project directory (relative to workspace)
    required: true
  stack:
    description: Pulumi stack name
    required: true
  safe-name:
    description: Optional artifact-safe name; defaults to project with '/' replaced by '__'
    required: false
  drift-mode:
    description: off, code, or live. live adds --refresh to the preview
    required: false
    default: 'off'
  no-refresh-projects:
    description: Comma-separated project paths that live mode previews without --refresh
    required: false
    default: ''
outputs:
  has_changes:
    description: Whether the preview detected any changes
    value: ${{ steps.main.outputs.has_changes }}
  drift_status:
    description: clean, drift, or unknown (the change count could not be read)
    value: ${{ steps.main.outputs.drift_status }}
  change_count:
    description: Resources the preview would change; empty when drift_status is unknown
    value: ${{ steps.main.outputs.change_count }}
runs:
  using: composite
  steps:
    - id: main
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        STACK: ${{ inputs.stack }}
        SAFE_NAME_IN: ${{ inputs.safe-name }}
        DRIFT_MODE: ${{ inputs.drift-mode }}
        NO_REFRESH_PROJECTS: ${{ inputs.no-refresh-projects }}
      run: bash "$GITHUB_ACTION_PATH/main.sh"
