name: probe-called
on:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }} default=${{ github.event.repository.default_branch }} workflow=${{ github.workflow }}"
          echo "cancel=${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && !startsWith(github.ref, 'refs/tags/') }}"
          sleep 270
