name: compute-flake-build-matrix
description: Evaluate flake outputs for the current system and emit uncached targets as a matrix include JSON plus a has_work flag. Requires Nix to be installed.
inputs:
  probe-timeout-seconds:
    description: Timeout (in seconds) for nix-eval-jobs cache probe
    required: false
    default: '180'
  extra-substituters:
    description: Optional newline-delimited extra substituter URLs to pass to nix-eval-jobs cache probing
    required: false
    default: ''
  extra-trusted-public-keys:
    description: Optional newline-delimited extra trusted public keys to pass to nix-eval-jobs cache probing
    required: false
    default: ''
  build-first:
    description: Optional newline-delimited shell globs matched against "<category>.<name>" (e.g. packages.rust-test-deps). Matching entries get a boolean field named first set to true and sort ahead of the rest, so nix.yml can build them in a first job stage. Use it for shared, expensive derivations that other entries depend on, so dependents do not hold a runner slot waiting on the daemon's lock for them. Without it, entries carry no first field.
    required: false
    default: ''
outputs:
  matrix_include:
    description: JSON array for strategy.matrix.include
    value: ${{ steps.compute.outputs.matrix_include }}
  has_work:
    description: Whether there is any uncached work to perform
    value: ${{ steps.compute.outputs.has_work }}
runs:
  using: composite
  steps:
    - id: compute
      shell: bash
      env:
        PROBE_TIMEOUT_SECONDS: ${{ inputs.probe-timeout-seconds }}
        INPUT_EXTRA_SUBSTITUTERS: ${{ inputs.extra-substituters }}
        INPUT_EXTRA_TRUSTED_PUBLIC_KEYS: ${{ inputs.extra-trusted-public-keys }}
        INPUT_BUILD_FIRST: ${{ inputs.build-first }}
      run: |
        bash "${{ github.action_path }}/main.sh"
