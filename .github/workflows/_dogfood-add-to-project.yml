# Disabled 2026-10-18: no project token yet. Re-enable once the fleet GitHub App lands (ergodicsystems/hq#253, jmmaloney4/sector7#165).
name: 📌 add to project (dogfood)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  add-to-project:
    # Secrets cannot be used in `if`; set PROJECT_URL when you want this enabled.
    if: vars.PROJECT_URL != ''
    uses: jmmaloney4/sector7/.github/workflows/add-to-project.yml@main
    with:
      project_url: ${{ vars.PROJECT_URL }}
    secrets:
      github-token: ${{ secrets.PROJECT_PAT }}
