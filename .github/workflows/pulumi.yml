name: '☁️ pulumi'
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label(s) for all jobs (string label or JSON array of labels; self-hosted must include light or heavy)'
        required: false
        default: '["self-hosted","heavy"]'
        type: string
      repository:
        description: 'Repository to checkout and build (owner/repo)'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout and build'
        required: true
        type: string
      google_workload_identity_provider:
        description: 'GCP Workload Identity Provider resource'
        required: true
        type: string
      google_service_account_email:
        description: 'GCP service account email'
        required: true
        type: string
      pulumi_backend_url:
        description: 'GCS bucket URL for Pulumi backend (e.g., gs://my-bucket-name)'
        required: true
        type: string
      pr_number:
        description: 'Pull request number to comment on (if any)'
        required: false
        type: number
      is_fork:
        description: 'Whether the PR head comes from a fork'
        required: false
        type: boolean
      ignore_projects:
        description: 'Comma-separated list of Pulumi projects (paths) to ignore'
        required: false
        type: string
      nodejs_package_manager:
        description: 'Node.js package manager: "pnpm", "npm", or "none"'
        required: true
        type: string
      binary-cache-url:
        description: 'Optional full binary cache URL to add as a substituter (e.g. https://cache.example.com/cache)'
        required: false
        default: ''
        type: string
      binary-cache-public-key:
        description: 'Optional trusted public key for the binary cache'
        required: false
        default: ''
        type: string
      binary-cache-endpoint:
        description: 'Optional Attic server endpoint (root URL) used for cache pushes'
        required: false
        default: ''
        type: string
      binary-cache-name:
        description: 'Optional Attic cache name used for cache pushes'
        required: false
        default: ''
        type: string
      drift_mode:
        description: >-
          Fail a stack's job when it is out of sync. `off` (the default) never fails on changes. `code` fails when the preview shows changes, meaning the code differs from Pulumi state. `live` also refreshes from the real infrastructure inside the preview (writes no state), so changes made outside Pulumi count too. A preview whose changes cannot be counted fails as `unknown`. A stack deployed by this run is not checked.
        required: false
        default: 'off'
        type: string
      drift_no_refresh_projects:
        description: 'Comma-separated Pulumi project paths that `live` previews without refreshing (they get the `code` check)'
        required: false
        default: ''
        type: string
      drift_issues:
        description: >-
          File drift as GitHub issues (needs drift_mode code or live, and `issues: write` granted by the caller). One issue per drifted (project, stack), labelled `pulumi-drift`; updated while drift persists (a comment only when a mode's status changes) and closed when every mode that reported a problem is clean again. Only runs on the default branch count.
        required: false
        default: false
        type: boolean
      preview_only:
        description: >-
          When true (the default), run previews and upload artifacts on every caller event but never `pulumi up`. Consumers must pass preview_only: false to enable stage/prod deploys.
        required: false
        default: true
        type: boolean
    secrets:
      BINARY_CACHE_TOKEN:
        description: 'Optional Attic token used to push built store paths into the binary cache'
        required: false
jobs:
  detect-pulumi-stacks:
    name: "🧩 detect pulumi stacks"
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJson(inputs.runs-on) || inputs.runs-on }}
    permissions:
      contents: read
      id-token: write
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      PULUMI_BACKEND_URL: ${{ inputs.pulumi_backend_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
      # sector7's own actions run from this workflow's commit, so a caller's
      # pin on the workflow pins every action it runs (zeus#5442). Keep this
      # after any default-path checkout: that one cleans the workspace.
      - name: check out sector7 at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sector7
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.sector7/.github/actions/nix-setup
        with:
          runs-on: ${{ inputs.runs-on }}
          # Keep the FlakeHub fallback enabled unless a fully-configured custom
          # cache is available (URL + public key both set). A URL without a
          # public key leaves nix-setup with an unverifiable substituter.
          cache: ${{ !contains(inputs.runs-on, 'self-hosted') && !(inputs.binary-cache-url != '' && inputs.binary-cache-public-key != '') }}
          extra-substituters: ${{ inputs.binary-cache-url }}
          extra-trusted-public-keys: ${{ inputs.binary-cache-public-key }}
          attic-endpoint: ${{ inputs.binary-cache-endpoint }}
          attic-cache-name: ${{ inputs.binary-cache-name }}
          # Forks don't get push credentials even if the caller supplies a token.
          attic-token: ${{ inputs.is_fork && '' || secrets.BINARY_CACHE_TOKEN }}
      - name: Detect all (project, stack) pairs
        id: set-matrix
        uses: ./.sector7/.github/actions/detect-pulumi-stacks
        with:
          ignore_projects: ${{ inputs.ignore_projects }}
  pulumi-preview-and-deploy:
    name: "🔍☁️ pulumi preview + deploy"
    needs: detect-pulumi-stacks
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJson(inputs.runs-on) || inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-pulumi-stacks.outputs.matrix) }}
    concurrency:
      # github.event_name here is the *caller* event (push / pull_request /
      # workflow_dispatch / …), never workflow_call. Use preview_only so
      # preview-only runs on main and v* tags share the preview group instead
      # of serializing on the deploy group.
      group: ${{ !inputs.preview_only && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && format('pulumi-deploy-{0}-{1}', matrix.project, matrix.stack) || format('pulumi-preview-{0}-{1}-{2}', matrix.project, matrix.stack, github.ref_name) }}
      cancel-in-progress: false
    permissions:
      packages: read
      id-token: write
      contents: read
      actions: write
    env:
      GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.google_workload_identity_provider }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ inputs.google_service_account_email }}
      PULUMI_BACKEND_URL: ${{ inputs.pulumi_backend_url }}
      PULUMI_CONFIG_PASSPHRASE: ""
      USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
      # sector7's own actions run from this workflow's commit, so a caller's
      # pin on the workflow pins every action it runs (zeus#5442). Keep this
      # after any default-path checkout: that one cleans the workspace.
      - name: check out sector7 at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sector7
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.sector7/.github/actions/pulumi-setup-v2
        with:
          google_workload_identity_provider: ${{ inputs.google_workload_identity_provider }}
          google_service_account_email: ${{ inputs.google_service_account_email }}
          nodejs_package_manager: ${{ inputs.nodejs_package_manager }}
          runs-on: ${{ inputs.runs-on }}
          extra-substituters: ${{ inputs.binary-cache-url }}
          extra-trusted-public-keys: ${{ inputs.binary-cache-public-key }}
          attic-endpoint: ${{ inputs.binary-cache-endpoint }}
          attic-cache-name: ${{ inputs.binary-cache-name }}
          # Forks don't get push credentials even if the caller supplies a token.
          attic-token: ${{ inputs.is_fork && '' || secrets.BINARY_CACHE_TOKEN }}
      - name: Validate .#ci-pulumi shell
        shell: bash
        env:
          NODEJS_PACKAGE_MANAGER: ${{ inputs.nodejs_package_manager }}
        run: |
          set -euo pipefail
          case "$NODEJS_PACKAGE_MANAGER" in
            pnpm|npm|none) ;;
            *)
              echo "❌ Error: Invalid nodejs_package_manager value '$NODEJS_PACKAGE_MANAGER'"
              echo "   Must be one of: pnpm, npm, none"
              exit 1
              ;;
          esac

          export DEVSHELL_NO_MOTD=1
          export DEVSHELL_NO_GREETING=1
          export DEVSHELL_QUIET=1

          # Variables in this script are expanded by the inner bash run inside nix develop.
          # shellcheck disable=SC2016
          nix develop .#ci-pulumi --command bash -euo pipefail -c '
            missing=0
            require_tool() {
              local tool="$1"
              if ! command -v "$tool" >/dev/null 2>&1; then
                echo "::error title=Missing tool in .#ci-pulumi::$tool is not available in the caller repository .#ci-pulumi shell" >&2
                missing=1
              fi
            }

            require_tool pulumi
            require_tool jq

            case "$NODEJS_PACKAGE_MANAGER" in
              pnpm|npm) require_tool "$NODEJS_PACKAGE_MANAGER" ;;
              none) ;;
            esac

            if [[ "$missing" -ne 0 ]]; then
              required_tools="pulumi, jq"
              case "$NODEJS_PACKAGE_MANAGER" in
                pnpm|npm) required_tools="$required_tools, $NODEJS_PACKAGE_MANAGER" ;;
              esac

              echo "" >&2
              echo "The reusable Pulumi workflow runs commands in the caller repository with:" >&2
              echo "  nix develop .#ci-pulumi --command ..." >&2
              echo "" >&2
              echo "Update the caller repository flake so .#ci-pulumi includes: $required_tools." >&2
              exit 1
            fi
          '
      # Auth & registry for GitHub Packages (public or private still needs a token)
      - name: Configure .npmrc for GitHub Packages
        if: ${{ inputs.nodejs_package_manager != 'none' }}
        run: |
          {
            echo "@jmmaloney4:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
            echo "always-auth=true"
          } >> ~/.npmrc
      - name: Install pnpm dependencies
        if: ${{ inputs.nodejs_package_manager == 'pnpm' }}
        run: nix develop .#ci-pulumi --command pnpm install --frozen-lockfile
        shell: bash
      - name: Install npm dependencies
        if: ${{ inputs.nodejs_package_manager == 'npm' }}
        run: nix develop .#ci-pulumi --command npm ci
        shell: bash
      - name: derive artifact-safe name
        id: names
        shell: bash
        run: |
          safe_name="${{ matrix.project }}"
          safe_name="${safe_name//\//__}"
          echo "safe_name=$safe_name" >> "$GITHUB_OUTPUT"
      - name: pulumi preview
        id: preview
        continue-on-error: true
        uses: ./.sector7/.github/actions/pulumi-preview
        with:
          project: ${{ matrix.project }}
          stack: ${{ matrix.stack }}
          safe-name: ${{ steps.names.outputs.safe_name }}
          drift-mode: ${{ inputs.drift_mode }}
          no-refresh-projects: ${{ inputs.drift_no_refresh_projects }}
      - name: upload stage preview artifacts
        if: ${{ always() && matrix.stack == 'stage' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage-previews-${{ steps.names.outputs.safe_name }}
          path: previews/*
          if-no-files-found: ignore
      - name: upload prod preview artifacts
        if: ${{ always() && matrix.stack == 'prod' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prod-previews-${{ steps.names.outputs.safe_name }}
          path: previews/*
          if-no-files-found: ignore
      - name: pulumi up (stage)
        if: ${{ steps.preview.outcome == 'success' && !inputs.preview_only && github.ref == 'refs/heads/main' && matrix.stack == 'stage' }}
        id: up_stage
        run: nix develop .#ci-pulumi --command pulumi up -C ${{ matrix.project }} --stack ${{ matrix.stack }} --yes --non-interactive
        shell: bash
      - name: pulumi up (prod)
        if: ${{ steps.preview.outcome == 'success' && !inputs.preview_only && startsWith(github.ref, 'refs/tags/v') && matrix.stack == 'prod' }}
        id: up_prod
        run: nix develop .#ci-pulumi --command pulumi up -C ${{ matrix.project }} --stack ${{ matrix.stack }} --yes --non-interactive
        shell: bash
      - name: record drift result
        if: ${{ always() && inputs.drift_issues }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRIFT_MODE: ${{ inputs.drift_mode }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          DRIFT_STATUS: ${{ steps.preview.outputs.drift_status }}
          CHANGE_COUNT: ${{ steps.preview.outputs.change_count }}
          UP_STAGE: ${{ steps.up_stage.outcome }}
          UP_PROD: ${{ steps.up_prod.outcome }}
          PREVIEW_JSON: previews/${{ steps.names.outputs.safe_name }}.json
          PROJECT: ${{ matrix.project }}
          STACK: ${{ matrix.stack }}
          SAFE_NAME: ${{ steps.names.outputs.safe_name }}
          REF: ${{ github.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUT_DIR: drift-results
        with:
          script: require('./.sector7/.github/actions/pulumi-drift-issues/drift.js').record(process.env)
      - name: upload drift result
        if: ${{ always() && inputs.drift_issues }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-result-${{ steps.names.outputs.safe_name }}-${{ matrix.stack }}
          path: drift-results/*
          if-no-files-found: error
      - name: fail job if preview failed
        if: ${{ steps.preview.outcome != 'success' }}
        run: |
          echo "Preview failed; skipping deploy and failing job."
          exit 1
        shell: bash
      - name: fail job on drift
        if: ${{ inputs.drift_mode != 'off' && steps.preview.outcome == 'success' && steps.preview.outputs.drift_status != 'clean' && steps.up_stage.outcome != 'success' && steps.up_prod.outcome != 'success' }}
        env:
          DRIFT_MODE: ${{ inputs.drift_mode }}
          DRIFT_STATUS: ${{ steps.preview.outputs.drift_status }}
          CHANGE_COUNT: ${{ steps.preview.outputs.change_count }}
          PROJECT: ${{ matrix.project }}
          STACK: ${{ matrix.stack }}
        run: |
          if [[ $DRIFT_STATUS == drift ]]; then
            message="$CHANGE_COUNT resource change(s) pending (drift_mode: $DRIFT_MODE). See the pulumi preview step."
          else
            message="could not read the preview's change count (drift_mode: $DRIFT_MODE), so the stack is not known to be in sync."
          fi
          echo "::error title=Pulumi drift in $PROJECT ($STACK)::$message"
          echo "### Pulumi drift: \`$PROJECT\` (\`$STACK\`): $message" >>"$GITHUB_STEP_SUMMARY"
          exit 1
        shell: bash
  drift-issues:
    name: "📋 drift issues"
    needs: [detect-pulumi-stacks, pulumi-preview-and-deploy]
    # Runs whether stacks passed or failed: a failed job is exactly what it reports.
    if: ${{ always() && inputs.drift_issues && needs.detect-pulumi-stacks.result == 'success' }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJson(inputs.runs-on) || inputs.runs-on }}
    # Two runs (a push and a schedule) must not edit the same issues at once.
    concurrency:
      group: pulumi-drift-issues-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: check out sector7 at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sector7
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: download drift results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: drift-result-*
          path: drift-results
          merge-multiple: true
      - name: reconcile drift issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const s = await require('./.sector7/.github/actions/pulumi-drift-issues/drift.js')
              .reconcile({ github, context, core, dir: 'drift-results' });
            await core.summary
              .addHeading('Pulumi drift issues', 3)
              .addList([
                `opened: ${s.opened.join(', ') || 'none'}`,
                `updated: ${s.updated.join(', ') || 'none'}`,
                `closed: ${s.closed.join(', ') || 'none'}`,
                `unchanged: ${s.unchanged.length}`,
              ])
              .write();
